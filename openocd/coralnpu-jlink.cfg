adapter driver jlink
transport select jtag

adapter speed 500

# JTAG chain position 0
jtag newtap riscv tap \
    -irlen 5 \
    -expected-id 0x04f5484d

# JTAG chain position 1
jtag newtap aux tap \
    -irlen 5 \
    -expected-id 0x10310a6d

target create riscv.cpu riscv \
    -chain-position riscv.tap \
    -rtos hwthread

target create riscv2.cpu riscv \
    -chain-position aux.tap \
    -rtos hwthread

riscv set_mem_access abstract
riscv set_command_timeout_sec 300

reset_config none
