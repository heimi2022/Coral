; Coral architectural bandwidth model, not a qualified DDR part speed bin.
; One x64 DDR channel at 4000 MT/s: 64/8 * 2/0.5 = 32 decimal GB/s.
; One BL8 transaction is 64 bytes, matching one 512-bit AXI beat.
; Based on DDR4_8Gb_x8_3200.ini. Minimum delays are rounded up to retain
; their absolute ns duration at tCK=0.5ns; tREFI is rounded down.
; tCCD_S remains BL/2=4 to express the target peak transfer bandwidth.

[dram_structure]
protocol = DDR4
bankgroups = 4
banks_per_group = 4
rows = 65536
columns = 1024
device_width = 8
BL = 8

[timing]
tCK = 0.5
AL = 0
CL = 28
CWL = 21
tRCD = 28
tRP = 28
tRAS = 66
tRFC = 706
tRFC2 = 525
tRFC4 = 323
tREFI = 15724
tRPRE = 2
tWPRE = 2
tRRD_S = 6
tRRD_L = 11
tWTR_S = 6
tWTR_L = 16
tFAW = 43
tWR = 31
tWR2 = 32
tRTP = 16
tCCD_S = 4
tCCD_L = 11
tCKE = 11
tCKESR = 12
tXS = 726
tXP = 13
tRTRS = 2

[power]
VDD = 1.2
IDD0 = 57
IPP0 = 3.0
IDD2P = 25
IDD2N = 37
IDD3P = 43
IDD3N = 52
IDD4W = 150
IDD4R = 168
IDD5AB = 250
IDD6x = 30

[system]
channel_size = 16384
channels = 1
bus_width = 64
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 8
trans_queue_size = 32

[other]
epoch_period = 2000000
output_level = 1
